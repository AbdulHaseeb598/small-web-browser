services:
  frontend:
    build: ./frontend
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      API_URL: http://backend:4000/api
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  backend:
    build: ./backend
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    environment:
      NODE_ENV: development
      PORT: "4000"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/small_web_browser}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      TSC_WATCHFILE: PriorityPollingInterval
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10

volumes:
  mongodb_data:
